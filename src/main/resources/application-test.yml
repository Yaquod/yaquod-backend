spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
  cache:
    type: none
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
    database: h2
  application:
    security:
      jwt:
        secret-key: a4b5cf541797e6f5fc8e0942fedb4b938aaa25fedb26f9e5be5efe99c38f9447
        access-token-expiration: 604800000
        refresh-token-expiration: 2592000000
        vehicle-token-expiration: 604800000
        vehicle-refresh-token-expiration: 2592000000
  mail:
    host: smtp.gmail.com
    port: 587
    username: test@example.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:8000/login/oauth2/code/google"
            client-name: Google

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:spring-boot-test-client}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topics:
    - topic/vehicle/update/location/order
    - topic/vehicle/update/location
    - topic/vehicle/update/status/order
    - topic/vehicle/update/status
    - topic/trip/eta
    - topic/trip/arrive
    - topic/trip/status
  qos: 1
  connection-timeout: 60
  keep-alive-interval: 60

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8000}

google:
  android:
    client-id: google-client-id-for-android.apps.googleusercontent.com
  ios:
    client-id: google-client-id-for-ios.apps.googleusercontent.com

payment:
  gateway:
    provider: paymob-egypt
    mode: sandbox
    mock-enabled: true
    free-testing-tier: true
    currency: EGP
  paymob:
    base-url: https://accept.paymob.com
    api-key: ${PAYMOB_API_KEY:test-api-key}
    secret-key: ${PAYMOB_SECRET_KEY:test-secret-key}
    public-key: ${PAYMOB_PUBLIC_KEY:test-public-key}
    integration-id: ${PAYMOB_INTEGRATION_ID:test-integration-id}
    moto-integration-id: ${PAYMOB_MOTO_INTEGRATION_ID:test-moto-integration-id}
    notification-url: ${PAYMOB_NOTIFICATION_URL:test-notification-url}
    redirection-url: ${PAYMOB_REDIRECT_URL:https://www.google.com/}

app:
  redis:
    expiry-listener:
      enabled: false
