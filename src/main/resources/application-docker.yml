spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgis}:${DB_PORT:5432}/${DB_NAME:yaquod}
    username: ${DB_USERNAME:yaquod}
    password: ${DB_PASSWORD:yaquod}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 600000
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:create-drop}
    show-sql: ${HIBERNATE_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    database: postgresql
  application:
    security:
      jwt:
        secret-key: ${JWT_SECRET_KEY:a4b5cf541797e6f5fc8e0942fedb4b938aaa25fedb26f9e5be5efe99c38f9447}
        access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:604800000}
        refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}
        vehicle-token-expiration: ${JWT_VEHICLE_TOKEN_EXPIRATION:604800000}
        vehicle-refresh-token-expiration: ${JWT_VEHICLE_REFRESH_TOKEN_EXPIRATION:2592000000}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID:placeholder-id}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:placeholder-secret}
            scope:
              - email
              - profile
            redirect-uri: ${OAUTH2_GOOGLE_REDIRECT_URI:http://localhost:8000/login/oauth2/code/google}
            client-name: Google
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://host.docker.internal:1883}
  client-id: ${MQTT_CLIENT_ID:spring-boot-client}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topics:
    - topic/vehicle/update/location/order
    - topic/vehicle/update/location
    - topic/vehicle/update/status/order
    - topic/vehicle/update/status
    - topic/trip/eta
    - topic/trip/arrive
    - topic/trip/status
  qos: ${MQTT_QOS:1}
  connection-timeout: ${MQTT_CONNECTION_TIMEOUT:60}
  keep-alive-interval: ${MQTT_KEEP_ALIVE_INTERVAL:60}

management:
  health:
    mail:
      enabled: false

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8000}


google:
  android:
    client-id: ${OAUTH2_GOOGLE_ANDROID_CLIENT_ID:placeholder-android}
  ios:
    client-id: ${OAUTH2_GOOGLE_IOS_CLIENT_ID:placeholder-ios}

payment:
  gateway:
    provider: paymob-egypt
    mode: sandbox
    mock-enabled: true
    free-testing-tier: true
    currency: EGP
  paymob:
    base-url: https://accept.paymob.com
    api-key: ${PAYMOB_API_KEY:test-api-key}
    secret-key: ${PAYMOB_SECRET_KEY:test-secret-key}
    public-key: ${PAYMOB_PUBLIC_KEY:test-public-key}
    integration-id: ${PAYMOB_INTEGRATION_ID:test-integration-id}
    moto-integration-id: ${PAYMOB_MOTO_INTEGRATION_ID:test-moto-integration-id}
    notification-url: ${PAYMOB_NOTIFICATION_URL:test-notification-url}
    redirection-url: ${PAYMOB_REDIRECT_URL:https://www.google.com/}

app:
  redis:
    expiry-listener:
      enabled: true
