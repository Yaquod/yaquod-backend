services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: postgis
    restart: always
    environment:
      POSTGRES_USER: yaquod
      POSTGRES_PASSWORD: yaquod
      POSTGRES_DB: yaquod
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  springboot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springboot-app
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgis:5432/yaquod
      - SPRING_DATASOURCE_USERNAME=yaquod
      - SPRING_DATASOURCE_PASSWORD=yaquod
      - MQTT_BROKER_URL=tcp://host.docker.internal:1883  #for Windows and Mac
      - MQTT_CLIENT_ID
      - OAUTH2_GOOGLE_CLIENT_ID
      - OAUTH2_GOOGLE_CLIENT_SECRET
      - OAUTH2_GOOGLE_REDIRECT_URI
      - OAUTH2_GOOGLE_ANDROID_CLIENT_ID
      - OAUTH2_GOOGLE_IOS_CLIENT_ID
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=  # leave empty if no password is set for Redis
      #- MQTT_BROKER_URL=tcp://<your linux ip>:1883  #for Linux with extra setup
    ports:
      - "8000:8000"
    restart: on-failure

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6380:6379"

volumes:
  postgis_data:


