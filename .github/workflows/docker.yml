name: Build, Run, and Test API

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop

jobs:
  build-run-test:
    runs-on: ubuntu-latest

    # Add service containers
    services:
      # Mosquitto MQTT Broker
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883
          - 9001:9001
        options: >-
          --health-cmd "timeout 5 mosquitto_sub -t '$$SYS/#' -C 1 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Verify MQTT broker is running
      - name: Verify MQTT Broker
        run: |
          echo "Testing MQTT broker connection..."
          docker run --rm --network host eclipse-mosquitto:2 mosquitto_pub -h localhost -t test/topic -m "test" || echo "MQTT broker test failed"
          echo "MQTT broker is ready on localhost:1883"

      - name: Build JAR with Maven
        run: mvn -B clean package -DskipTests

      # Run tests
      - name: Run Unit Tests
        run: mvn test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Build and Run Docker containers
        run: |
          docker compose up --build -d
          echo "Waiting for app to start..."
          sleep 30
          docker ps
          docker logs springboot-app | tail -n 50

      - name: Check Spring Boot Endpoint
        run: |
          echo "Testing /api/auth/test endpoint..."
          curl --fail http://localhost:8000/api/auth/test || (echo "❌ Endpoint not reachable" && exit 1)

      # Test MQTT integration with running app
      - name: Test MQTT Integration
        run: |
          echo "Testing MQTT integration..."
          # Publish a test message
          docker run --rm --network host eclipse-mosquitto:2 \
            mosquitto_pub -h localhost -t topic/test -m '{"test": "message"}' \
            && echo "✅ MQTT publish successful" \
            || echo "❌ MQTT publish failed"

      - name: Tear down containers
        if: always()
        run: docker compose down
