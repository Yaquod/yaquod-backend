name: Build, Run, and Test API

on:
  push:
    branches:
      - feature/docker
      - develop        # added develop branch
  pull_request:
    branches:
      - feature/docker
      - develop        # added develop branch

jobs:
  build-run-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout branch
        uses: actions/checkout@v4

      - name: 🧰 Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🧱 Build JAR with Maven
        run: mvn -B clean package -DskipTests

#      - name: 🧪 Run Unit Tests
#        run: mvn test

      - name: 🐳 Build and Run Docker containers
        run: |
          docker compose up --build -d
          echo "⏳ Waiting for app to start..."
          sleep 30
          docker ps
          docker logs springboot-app | tail -n 50

      - name: 🌐 Check Spring Boot Endpoint
        run: |
          echo "Testing /api/auth/docker endpoint..."
          curl --fail http://localhost:8000/api/auth/test || (echo "❌ Endpoint not reachable" && exit 1)

      - name: 🧹 Tear down containers
        if: always()
        run: docker compose down


