name: Build, Run, and Test API

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop

jobs:
  build-run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      ###############################################
      # 🔥 AUTO FORMAT JAVA CODE WITH SPOTLESS
      ###############################################
      - name: Run Java Formatter (Spotless)
        run: mvn -B spotless:apply

      - name: Commit formatting changes (if any)
        run: |
          if [[ `git status --porcelain` ]]; then
            echo "Formatting changes detected — committing..."
            git config --global user.email "actions@github.com"
            git config --global user.name "GitHub Actions"
            git add .
            git commit -m "Apply Java formatting (Spotless)"
            git push
          else
            echo "No formatting changes needed."
          fi
      ###############################################

      - name: Install Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients

      - name: Start Mosquitto Broker
        run: |
          mosquitto -d

      - name: Verify Broker is running on localhost:1883
        run: |
          echo "Waiting for broker to start..."
          sleep 2
          
          echo "Subscribing to topic 'github/action'..."
          mosquitto_sub -h localhost -p 1883 -t 'github/action' -C 1 | grep -q 'it works!' &
          
          echo "Publishing test message..."
          mosquitto_pub -h localhost -p 1883 -t 'github/action' -m 'it works!'
          
          wait
          echo "✅ Test message received successfully!"

      - name: Verify MQTT Broker
        run: |
          echo "Testing MQTT broker connection..."
          docker run --rm --network host eclipse-mosquitto:2 mosquitto_pub -h localhost -t test/topic -m "test" || echo "MQTT broker test failed"
          echo "MQTT broker is ready on localhost:1883"

      - name: Build JAR with Maven
        run: mvn -B clean package -DskipTests

      - name: Run Unit & Integration Tests
        run: mvn test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Build and Run Docker containers
        run: |
          docker compose up --build -d
          echo "Waiting for app to start..."
          sleep 30
          docker ps
          docker logs springboot-app | tail -n 50

      - name: Check Spring Boot Endpoint
        run: |
          echo "Testing /api/auth/test endpoint..."
          curl --fail http://localhost:8000/api/auth/test || (echo "❌ Endpoint not reachable" && exit 1)

      - name: Test MQTT Integration
        run: |
          echo "Testing MQTT integration..."
          docker run --rm --network host eclipse-mosquitto:2 \
            mosquitto_pub -h localhost -t topic/test -m '{"test": "message"}' \
            && echo "✅ MQTT publish successful" \
            || echo "❌ MQTT publish failed"

      - name: Tear down containers
        if: always()
        run: docker compose down
