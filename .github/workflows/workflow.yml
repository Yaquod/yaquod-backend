name: Build, Run, and Test API

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop

jobs:
  build-run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install Mosquitto
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients
          
      - name: Start Mosquitto Broker
        run: |
          # Start the broker as a background daemon
          mosquitto -d

      # Verify MQTT broker is running
      - name: Verify MQTT Broker
        run: |
          echo "Testing MQTT broker connection..."
          docker run --rm --network host eclipse-mosquitto:2 mosquitto_pub -h localhost -t test/topic -m "test" || echo "MQTT broker test failed"
          echo "MQTT broker is ready on localhost:1883"

      - name: Create Firebase Config File
        run: |
          echo "${{ secrets.FIREBASE_CONFIG_JSON }}" | base64 --decode > src/main/resources/firebase-service-account.json

      - name: Build JAR with Maven
        run: mvn -B clean package -DskipTests

      - name: Run Unit & Integration Tests
        run: mvn test -DforkCount=1 -DreuseForks=false

      - name: Spotless Check
        run: mvn spotless:check

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Build and Run Docker containers
        env:
          OAUTH2_GOOGLE_CLIENT_ID: "dummy-id"
          OAUTH2_GOOGLE_CLIENT_SECRET: "dummy-secret"
          OAUTH2_GOOGLE_ANDROID_CLIENT_ID: "dummy-android"
          OAUTH2_GOOGLE_IOS_CLIENT_ID: "dummy-ios"
        run: |
          docker compose up --build -d
          echo "Waiting for app to start..."
          sleep 30
          docker ps
          docker logs springboot-app | tail -n 50

      - name: Check Spring Boot Endpoint
        run: |
          echo "Testing /api/auth/test endpoint..."
          curl --fail http://localhost:8000/api/auth/test || (echo "❌ Endpoint not reachable" && exit 1)

      # Test MQTT integration with running app
      - name: Test MQTT Integration
        run: |
          echo "Testing MQTT integration..."
          # Publish a test message
          docker run --rm --network host eclipse-mosquitto:2 \
            mosquitto_pub -h localhost -t topic/test -m '{"test": "message"}' \
            && echo "✅ MQTT publish successful" \
            || echo "❌ MQTT publish failed"

      - name: Tear down containers
        if: always()
        run: docker compose down
